services:
  kafka-control-center:
    image: confluentinc/cp-enterprise-control-center:7.9.8
    container_name: kafka-control-center
    hostname: control_center
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -o /dev/null -s -w \"%{http_code}\n\" http://localhost:9021" ]
      interval: 10s
      timeout: 60s
      retries: 3
      start_period: 60s
    depends_on:
      zookeeper:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
      kafka-schema-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:9021:9021"
    environment:
      CONTROL_CENTER_HEAP_OPTS: "-Xms256m -Xmx768m"
      CONTROL_CENTER_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka_broker:9092"
      CONTROL_CENTER_ZOOKEEPER_CONNECT: "zookeeper:2181"
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://kafka-schema-registry:8081"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021
    networks:
      - esnet
