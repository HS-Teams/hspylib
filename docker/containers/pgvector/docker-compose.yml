services:

  pgvector-db:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: pgvector-db
    hostname: pgvector-db
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 60s
      retries: 3
      start_period: 60s
    environment:
      POSTGRES_DB: homeselect
      POSTGRES_USER: ${PGUSER:-homeselect}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgvector-db-data:/var/lib/postgresql/data
    networks:
      - esnet

networks:
  esnet:

volumes:
  pgvector-db-data:
