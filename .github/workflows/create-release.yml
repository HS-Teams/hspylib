name: create-release
run-name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name'
        required: true
        type: string
      package_name:
        description: 'PyPi package name'
        required: true
        type: choice
        options:
          - hspylib
          - hspylib-clitt
          - hspylib-datasource
          - hspylib-firebase
          - hspylib-hqt
          - hspylib-kafman
          - hspylib-setman
          - hspylib-vault

env:
  PACKAGE_NAME: "${{ inputs.package_name }}"
  TAG_NAME: "${{ inputs.tag_name }}"
  OWNER: "${{ vars.OWNER }}"

permissions:
  contents: write

jobs:
  details:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.release.outputs.new_version }}
      module: ${{ steps.release.outputs.module }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract tag and Details
        id: release
        run: |
          set -euo pipefail
          case "$PACKAGE_NAME" in
            hspylib) MODULE=hspylib ;;
            hspylib-clitt|hspylib-datasource|hspylib-firebase|hspylib-hqt|hspylib-kafman|hspylib-setman|hspylib-vault)
              MODULE="${PACKAGE_NAME#hspylib-}" ;;
            *) echo "Unsupported package: $PACKAGE_NAME"; exit 1 ;;
          esac
          case "$TAG_NAME" in
            "$MODULE"-v*) NEW_VERSION="${TAG_NAME#"$MODULE"-v}" ;;
            v[0-9]*) NEW_VERSION="${TAG_NAME#v}" ;;
            [0-9]*) NEW_VERSION="$TAG_NAME" ;;
            *) echo "Tag does not match module $MODULE: $TAG_NAME"; exit 1 ;;
          esac
          git check-ref-format "refs/tags/$TAG_NAME"
          git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "module=$MODULE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          printf 'Package: %s\nModule: %s\nVersion: %s\nTag: %s\n'             "$PACKAGE_NAME" "$MODULE" "$NEW_VERSION" "$TAG_NAME" >> "$GITHUB_STEP_SUMMARY"

  check_pypi:
    needs: details
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v3
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
      - run: python -m pip install packaging
      - name: Ensure new version
        env:
          NEW_VERSION: ${{ needs.details.outputs.new_version }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import urlopen
          from packaging.version import Version
          candidate = Version(os.environ["NEW_VERSION"])
          package = os.environ["PACKAGE_NAME"]
          try:
              with urlopen(f"https://pypi.org/pypi/{package}/json", timeout=30) as response:
                  releases = json.load(response)["releases"]
          except HTTPError as error:
              if error.code != 404:
                  raise
              releases = {}
          versions = [Version(value) for value in releases]
          if versions and candidate <= max(versions):
              raise SystemExit(f"{candidate} must be newer than {max(versions)}")
          print(f"Validated {package} version {candidate}")
          PYTHON

  build_and_test:
    needs: [details, check_pypi]
    runs-on: ubuntu-latest
    env:
      MODULE: ${{ needs.details.outputs.module }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.details.outputs.tag_name }}
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION }}
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: ${{ vars.GRADLE_VERSION }}
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - uses: actions/setup-python@v3
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
      - name: Install System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 libmagic-dev portaudio19-dev python3-pyaudio ffmpeg
      - name: Update PIP
        run: pip install --upgrade pip
      - name: Workaround for Python Magic
        run: |
          python3 -m pip install git+https://github.com/julian-r/python-magic.git
      - name: Install Python tools
        run: gradle ":$MODULE:installBuildTools" ":$MODULE:sdist"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: modules/${{ needs.details.outputs.module }}/build/dist/
          if-no-files-found: error

  pypi_publish:
    name: Upload release to PyPI
    needs: [build_and_test, details]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Create GitHub Release
    needs: [build_and_test, details, pypi_publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" dist/* --title "$PACKAGE_NAME-$TAG_NAME" --generate-notes
